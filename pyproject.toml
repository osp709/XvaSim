[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xvasim"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "numba>=0.60.0",
    "numexpr>=2.8.0",
    "numpy>=2.0.0",
    "scipy>=1.18.0",
]

[dependency-groups]
dev = [
    "coverage>=7.15.4",
    "numpy>=2.5.1",
    "pyrefly>=1.1.1",
    "pytest>=9.1.1",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.20",
]

[tool.pyrefly.errors]
redundant-cast = "warn"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "RUF", # Ruff-specific rules
]
ignore = [
    "RUF001", # Ambiguous Unicode character in string
    "RUF002", # Ambiguous Unicode character in docstring
    "RUF003", # Ambiguous Unicode character in comment
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = [".", "src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
markers = [
    "unit: Fast, isolated unit tests",
    "integration: End-to-end multi-asset or pipeline tests",
    "benchmark: Analytical vs Monte Carlo convergence benchmarks",
    "slow: Tests with higher Monte Carlo path counts",
]

[tool.coverage.run]
source = ["src/xvasim"]
branch = true
omit = []

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 95
precision = 1
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if typing.TYPE_CHECKING:",
    "@typing.overload",
    "@overload",
    "@abstractmethod",
    "@abc.abstractmethod",
]

[tool.pyrefly]
python-version = "3.14.0"
preset = "legacy"
search-path = [".", "src"]
